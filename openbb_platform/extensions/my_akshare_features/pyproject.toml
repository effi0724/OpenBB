[tool.poetry]
name = "openbb-my-akshare-features"
version = "1.0.0"
description = "Custom AKShare features extension for OpenBB"
authors = ["Custom Developer <dev@example.com>"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "openbb_my_akshare_features" }]

[tool.poetry.dependencies]
python = ">=3.9.21,<3.13"
openbb-core = "^1.4.8"
akshare = "^1.14.0"
pandas = "^2.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.plugins."openbb_core_extension"]
my_akshare_features = "openbb_my_akshare_features.router:router"
